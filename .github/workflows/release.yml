name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/bacnet-ip-rest-proxy ./cmd/bacnet-ip-rest-proxy

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: amd64
        run: |
          mkdir -p dist
          nfpm pkg --packager deb --config packaging/nfpm.yaml \
            --target "dist/bacnet-ip-rest-proxy_${VERSION}_${ARCH}.deb"

      - name: Name release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp dist/bacnet-ip-rest-proxy "dist/bacnet-ip-rest-proxy_${VERSION}_linux_amd64"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/bacnet-ip-rest-proxy_*.deb \
            dist/bacnet-ip-rest-proxy_*_linux_amd64
