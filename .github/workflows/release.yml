name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o dist/bacnet-ip-rest-proxy ./cmd/bacnet-ip-rest-proxy

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: amd64
        run: |
          mkdir -p dist
          nfpm pkg --packager deb --config packaging/nfpm.yaml \
            --target "dist/bacnet-ip-rest-proxy_${VERSION}_${ARCH}.deb"

      - name: Name release binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp dist/bacnet-ip-rest-proxy "dist/bacnet-ip-rest-proxy_${VERSION}_linux_amd64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/stblassitude/bacnet-ip-rest-proxy:${{ steps.version.outputs.version }}
            ghcr.io/stblassitude/bacnet-ip-rest-proxy:latest

      - name: Write release notes
        run: |
          # The summary line of every commit since the previous release tag
          # (or of all commits, for the first release).
          if prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null); then
            range="${prev}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "${range}"
            if [ -n "${prev:-}" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            fi
          } > dist/release-notes.md
          cat dist/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md \
            dist/bacnet-ip-rest-proxy_*.deb \
            dist/bacnet-ip-rest-proxy_*_linux_amd64
